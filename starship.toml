add_newline = false

format = """
$username\
$directory\
$git_branch\
$git_status\
$character
"""

[character]
success_symbol = " [➜](bold green)"
error_symbol = " [➜](bold red)"
vimcmd_symbol = " [❮](bold green)"

[username]
show_always = true
format = "[$user](bold cyan)"

[directory]
truncation_length = 3
style = "bold white"
format = " [$path]($style)"

[git_branch]
symbol = " "
style = "bold purple"
format = " on [$symbol$branch]($style)"

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style))'
